name: Reset Demo Data

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 min — the shared demo admin account needs a short leash
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Call reset endpoint
        run: |
          curl -sf -X POST "${{ secrets.RENDER_APP_URL }}/admin/reset-demo" \
            -H "X-Reset-Key: ${{ secrets.RESET_SECRET }}"

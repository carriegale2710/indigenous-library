<svg width="310" height="680" viewBox="0 0 310 680" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="155" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#4A3060">Item into collection</text>

  <!-- Legend -->
  <rect x="10" y="36" width="290" height="26" rx="5" fill="#F5F3F9" stroke="#C4B8DC" stroke-width="0.5"/>
  <rect x="18" y="43" width="10" height="10" rx="2" fill="#1D9E75"/>
  <text x="32" y="52" font-size="10" fill="#444441">LIB / ADM</text>
  <rect x="100" y="43" width="10" height="10" rx="2" fill="#7B5EA7"/>
  <text x="114" y="52" font-size="10" fill="#444441">CE / ADM</text>
  <rect x="180" y="43" width="10" height="10" rx="2" fill="#EF9F27"/>
  <text x="194" y="52" font-size="10" fill="#444441">System</text>

  <!-- START -->
  <rect x="55" y="76" width="200" height="34" rx="17" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="155" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#085041">LIB / ADM logs in</text>

  <line x1="155" y1="110" x2="155" y2="132" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Complete form -->
  <rect x="52" y="132" width="206" height="48" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="155" y="151" text-anchor="middle" font-size="12" font-weight="600" fill="#085041">Complete item form</text>
  <text x="155" y="169" text-anchor="middle" font-size="11" fill="#0F6E56">Title, type, collection</text>

  <line x1="155" y1="180" x2="155" y2="202" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- System sets pending -->
  <rect x="52" y="202" width="206" height="48" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text x="155" y="221" text-anchor="middle" font-size="12" font-weight="600" fill="#633806">Status → Pending</text>
  <text x="155" y="239" text-anchor="middle" font-size="11" fill="#854F0B">Auto-set by system</text>

  <line x1="155" y1="250" x2="155" y2="272" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Item visible -->
  <rect x="52" y="272" width="206" height="48" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text x="155" y="291" text-anchor="middle" font-size="12" font-weight="600" fill="#633806">Item in catalogue</text>
  <text x="155" y="309" text-anchor="middle" font-size="11" fill="#854F0B">No request button shown</text>

  <line x1="155" y1="320" x2="155" y2="342" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- CE reviews -->
  <rect x="52" y="342" width="206" height="48" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="155" y="361" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">CE reviews item</text>
  <text x="155" y="379" text-anchor="middle" font-size="11" fill="#534AB7">Adds cultural metadata</text>

  <line x1="155" y1="390" x2="155" y2="412" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Access recommendation -->
  <rect x="52" y="412" width="206" height="48" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="155" y="431" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">Access recommendation</text>
  <text x="155" y="449" text-anchor="middle" font-size="11" fill="#534AB7">Set in metadata form</text>

  <line x1="155" y1="460" x2="155" y2="482" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- System updates -->
  <rect x="52" y="482" width="206" height="48" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text x="155" y="501" text-anchor="middle" font-size="12" font-weight="600" fill="#633806">Status updated</text>
  <text x="155" y="519" text-anchor="middle" font-size="11" fill="#854F0B">Open / Restricted / CS</text>

  <line x1="155" y1="530" x2="155" y2="552" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- END -->
  <rect x="55" y="552" width="200" height="34" rx="17" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="155" y="573" text-anchor="middle" font-size="12" font-weight="600" fill="#2C2C2A">Item available in full</text>

  <!-- CARE note -->
  <rect x="10" y="602" width="290" height="56" rx="6" fill="#EDE8F5" stroke="#7B5EA7" stroke-width="0.5"/>
  <text x="20" y="620" font-size="10" font-weight="600" fill="#4A3060">CARE note:</text>
  <text x="20" y="636" font-size="10" fill="#534AB7">Cultural metadata is community knowledge.</text>
  <text x="20" y="650" font-size="10" fill="#534AB7">Library Staff do not have authority to populate</text>
  <text x="20" y="664" font-size="10" fill="#534AB7">this — CE / ADM only (Authority to Control).</text>

</svg>
